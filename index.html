<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Starfall</title>
    <meta name="theme-color" content="#16131c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      html, body { margin: 0; height: 100%; background: #fffaf0; overflow: hidden; }
      #game { width: 100vw; height: 100vh; height: 100dvh; touch-action: none; user-select: none; -webkit-user-select: none; }
      #update-banner {
        position: fixed; left: 50%; top: 12px; transform: translateX(-50%); z-index: 10;
        display: flex; gap: 8px; align-items: center; padding: 8px 10px 8px 14px;
        background: #1e2633f2; color: #f4f7fb; border: 1px solid #8ea3c2; border-radius: 8px;
        font: 13px "Trebuchet MS", Verdana, sans-serif; max-width: calc(100vw - 32px);
      }
      #update-banner button {
        font: inherit; color: #141a24; background: #ffe27a; border: 0; border-radius: 6px; padding: 6px 10px;
      }
      #error-banner {
        position: fixed; left: 8px; right: 8px; bottom: 8px; z-index: 11; white-space: pre-wrap; word-break: break-word;
        padding: 8px 10px; background: #3a1820f2; color: #ffe0e0; border: 1px solid #ff8a8a; border-radius: 6px;
        font: 11px/1.35 ui-monospace, Menlo, monospace; max-height: 40vh; overflow: auto;
      }
      #update-banner button.later { background: #3a4a63; color: #f4f7fb; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
